name: My First Push
on:
  pull_request: 
    types: [opened, synchronize, reopened, closed]

jobs:
  Tarea1:
    runs-on: ubuntu-22.04

    steps:
      - name: Datos del Push
        run: |
          echo "Autor del Push ${{github.event.head_commit.author.name}}"
          echo "Mensaje ${{github.event.head_commit.message}}"

      - name: Desplegar Datos del Push
        run: |
          echo "Autor: ${{ github.event.pull_request.user.login }}"
          echo "Mensaje del último commit: ${{ github.event.pull_request.title }}"
          echo "ID del commit: ${{ github.event.pull_request.head.sha }}"
          echo "URL del commit: ${{ github.event.pull_request.html_url }}"
          echo "Rama: ${{ github.event.pull_request.head.ref }}"
          echo "Repositorio: ${{ github.repository }}"

      - name: Datos del Pull Request
        run: |
          echo "Datos origen: ${{ github.event.pull_request.head.label }}"
          echo "Datos destino: ${{ github.event.pull_request.base.label }}"
          echo "Título: ${{ github.event.pull_request.title }}"
          echo "Contenido: ${{ github.event.pull_request.body }}"
          echo "Estado: ${{ github.event.pull_request.state }}"
          echo "¿Ya fue fusionado?: ${{ github.event.pull_request.merged }}"
